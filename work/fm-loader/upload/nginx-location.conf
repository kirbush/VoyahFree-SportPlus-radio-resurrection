# Include inside the existing HTTPS server. Authentication runs before ZIP input.
location = /_voyah-fm-auth {
    internal;
    proxy_pass http://127.0.0.1:18089/_auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    access_log off;
}
location ~ "^/voyah-fm/v1/reports/[0-9a-f]{64}$" {
    if ($request_method != PUT) { return 405; }
    auth_request /_voyah-fm-auth;
    limit_req zone=voyah_fm_rate burst=12 nodelay;
    limit_req_status 429;
    limit_conn voyah_fm_ip 2;
    limit_conn voyah_fm_total 6;
    limit_conn_status 429;
    client_max_body_size 16m;
    client_body_buffer_size 16k;
    client_body_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 20s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:18089;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    access_log /var/log/nginx/voyah-fm-upload-access.log combined;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
location /voyah-fm/ { return 404; }
